<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Chill d Balls</title>

    <!-- ===== ESTILOS ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- ===== ENCABEZADO ===== -->
    <header class="encabezado py-3 text-center">
        <div class="container d-flex flex-column align-items-center position-relative">
            <!-- Botones de sesión (js/sesion.js) -->
            <div id="zonaUsuario" class="zona-usuario"></div>

            <a href="index.html" class="mb-2">
                <img src="img/logo.png" alt="Chill d Balls Logo" class="mi-logo">
            </a>

            <div class="text-center">
                <h1 class="h2 m-0 fw-bold">CHILL D BALLS</h1>
                <small>Mood 2k07</small>
            </div>
        </div>
    </header>

    <!-- ===== CONTENIDO: formulario ===== -->
    <main class="container my-5 d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="caja-producto p-4 text-start">
                
                <h3 class="text-center mb-4 fw-bold" id="tituloEditar">EDITAR ZAPATO</h3>
                
                <form id="formEditar">

                    <div class="mb-3">
                        <label for="prod_id" class="form-label fw-bold">Código / ID:</label>
                        <input type="text" class="form-control" id="prod_id" required readonly>
                    </div>

                    <div class="mb-3">
                        <label for="prod_nombre" class="form-label fw-bold">Nombre del Zapato:</label>
                        <input type="text" class="form-control" id="prod_nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="prod_descripcion" class="form-label fw-bold">Descripción:</label>
                        <input type="text" class="form-control" id="prod_descripcion" required>
                    </div>

                    <div class="mb-3">
                        <label for="prod_tallas" class="form-label fw-bold">Tallas Disponibles:</label>
                        <input type="text" class="form-control" id="prod_tallas" required>
                    </div>

                    <div class="mb-3">
                        <label for="prod_precio" class="form-label fw-bold">Precio (COP):</label>
                        <input type="number" class="form-control" id="prod_precio" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label for="prod_estado" class="form-label fw-bold">Estado de Inventario:</label>
                        <select class="form-select" id="prod_estado" required>
                            <option value="Disponible">Disponible</option>
                            <option value="Pocas Unidades">Pocas Unidades</option>
                            <option value="Agotado">Agotado</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="prod_imagen" class="form-label fw-bold">Cambiar Imagen (Opcional):</label>
                        <input type="file" class="form-control" id="prod_imagen" accept="image/*">
                        <div class="form-text">Si eliges una, cópiala antes dentro de la carpeta <strong>img/</strong>.</div>
                    </div>

                    <button type="submit" class="btn-warning btn w-100 py-2 mb-3 fw-bold">Actualizar Producto</button>

                    <div class="text-center">
                        <small><a href="tabla.html" class="text-muted text-decoration-none">← Cancelar y volver a la tabla</a></small>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- ===== PIE DE PÁGINA ===== -->
    <footer class="pie-pagina text-center py-2 mt-auto">
        <p class="m-0">Editar Producto - Chill d Balls</p>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/productos.js"></script>
    <script src="js/sesion.js"></script>
    <script>
        // ----- ACCESO -----
        exigirSesion();

        // ----- BUSCAR EL PRODUCTO -----
        var parametros = new URLSearchParams(window.location.search);
        var idEditar = parametros.get("id");

        var productos = cargarProductos();
        var producto = null;
        for (var i = 0; i < productos.length; i++) {
            if (productos[i].id === idEditar) {
                producto = productos[i];
            }
        }

        // ----- LLENAR EL FORMULARIO -----
        if (producto === null) {
            alert("Producto no encontrado.");
            window.location.href = "tabla.html";
        } else {
            document.getElementById("tituloEditar").textContent = "EDITAR ZAPATO #" + producto.id;
            document.getElementById("prod_id").value = producto.id;
            document.getElementById("prod_nombre").value = producto.nombre;
            document.getElementById("prod_descripcion").value = producto.descripcion;
            document.getElementById("prod_tallas").value = producto.tallas;
            document.getElementById("prod_precio").value = producto.precio;
            document.getElementById("prod_estado").value = producto.estado;
        }

        // ----- GUARDAR CAMBIOS -----
        document.getElementById("formEditar").addEventListener("submit", function (evento) {
            evento.preventDefault();

            producto.nombre = document.getElementById("prod_nombre").value.trim();
            producto.descripcion = document.getElementById("prod_descripcion").value.trim();
            producto.tallas = document.getElementById("prod_tallas").value.trim();
            producto.precio = Number(document.getElementById("prod_precio").value);
            producto.estado = document.getElementById("prod_estado").value;

            var archivo = document.getElementById("prod_imagen").files[0];
            if (archivo) {
                producto.imagen = "img/" + archivo.name;
            }

            guardarProductos(productos);
            window.location.href = "tabla.html";
        });
    </script>

</body>
</html>
