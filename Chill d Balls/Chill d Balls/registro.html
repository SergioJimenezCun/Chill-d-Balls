<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Chill d Balls</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="encabezado py-3 text-center">
        <div class="container d-flex flex-column align-items-center position-relative">
        
            <div class="position-absolute end-0 top-0 mt-2 me-2">
                <a href="login.html" class="btn btn-outline-light btn-sm fw-bold me-1">Login</a>
            </div>

            <a href="index.html" class="mb-2">
                <img src="img/logo.png" alt="Chill d Balls Logo" class="mi-logo">
            </a>

            <div class="text-center">
                <h1 class="h2 m-0 fw-bold">CHILL D BALLS</h1>
                <small>Mood 2k07</small>
            </div>

        </div>
    </header>

    <main class="container my-5 d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="caja-producto p-4 text-start">
                <h3 class="text-center mb-4 fw-bold">CREAR CUENTA</h3>
                
                <form action="index.html" method="get">
                    
                    <div class="mb-3">
                        <label for="reg-nombre" class="form-label fw-bold">Nombre Completo:</label>
                        <input type="text" class="form-control" id="reg-nombre" placeholder="Tu Nombre y Apellido" required minlength="3">
                    </div>

                    <div class="mb-3">
                        <label for="reg-email" class="form-label fw-bold">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="reg-tel" class="form-label fw-bold">Teléfono (10 dígitos):</label>
                        <input type="tel" class="form-control" id="reg-tel" placeholder="3001234567" pattern="[0-9]{10}" required>
                    </div>

                    <div class="mb-3">
                        <label for="reg-password" class="form-label fw-bold">Contraseña:</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>

                    <div class="mb-3">
                        <label for="reg-password-confirm" class="form-label fw-bold">Confirmar Contraseña:</label>
                        <input type="password" class="form-control" id="reg-password-confirm" placeholder="Repite tu contraseña" required minlength="6">
                    </div>

                    <button type="submit" class="btn-comprar w-100 py-2 mb-3">Registrarme</button>

                    <div class="text-center">
                        <small>¿Ya tienes cuenta? <a href="login.html" class="fw-bold text-decoration-none">Inicia sesión</a></small> <br>
                        <small><a href="index.html" class="text-muted text-decoration-none">Volver al catálogo</a></small>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="pie-pagina text-center py-2 mt-auto">
        <p class="m-0">Fin registro - Chill d Balls</p>
    </footer>

</body>
</html>
