<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill d Balls - Catálogo de Zapatos</title>

    <!--  ESTILOS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!--  ENCABEZADO  -->
    <header class="encabezado py-3 px-2 px-sm-4">
        
        <div class="container d-flex flex-column align-items-center position-relative">

            <nav class="menu-nav">
                <ul>
                    <li><a href="#">inicio</a></li>
                    <li><a href="contactanos.html">contactanos</a></li>
                    <li><a href="bombocla.html">sobre nosotros</a></li>
                </ul>
            </nav>
        
            <!-- Botones de sesión (js/sesion.js) -->
            <div id="zonaUsuario" class="zona-usuario"></div>

            <a href="index.html" class="mb-2">
                <img src="img/logo.png" alt="Chill d Balls Logo" class="mi-logo">
            </a>

            <div class="text-center">
                <h1 class="h2 m-0 fw-bold">CHILL D BALLS</h1>
                <small>Mood 2k07</small>
            </div>

        </div>
    </header>

    <!--  CONTENIDO: catálogo  -->
    <div class="container my-4 text-center">
        
        <h2 class="titulo-seccion">Colección de Zapatos</h2>

        <div class="row g-4" id="listaProductos"></div>
    </div>

    <!--  PIE DE PÁGINA  -->
    <footer class="pie-pagina text-center py-2 mt-auto">
        <p class="m-0">Fin catalogo</p>
    </footer>

    <!--  MODAL: detalle del producto  -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content caja-producto">
                <div class="modal-header encabezado">
                    <h5 class="modal-title fw-bold" id="detalleNombre"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 align-items-center">
                        <div class="col-12 col-md-6">
                            <img id="detalleImagen" src="" alt="" class="foto-zapato" style="height: 280px;">
                        </div>
                        <div class="col-12 col-md-6 text-start">
                            <p id="detalleDescripcion"></p>
                            <p><strong>Tallas:</strong> <span id="detalleTallas"></span></p>
                            <p><strong>Estado:</strong> <span id="detalleEstado" class="badge"></span></p>
                            <p class="precio fs-3" id="detallePrecio"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary rounded-pill fw-bold" data-bs-dismiss="modal">Cerrar</button>
                    <a href="compra.html" id="btnComprar" class="btn-comprar text-decoration-none text-dark">Comprar</a>
                </div>
            </div>
        </div>
    </div>

    <!--  SCRIPTS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/sesion.js"></script>
    <script>
        //  MODAL DE DETALLE 
        var modalDetalle = new bootstrap.Modal(document.getElementById("modalDetalle"));

        function abrirDetalle(producto) {
            document.getElementById("detalleNombre").textContent = producto.nombre;
            document.getElementById("detalleImagen").src = producto.imagen;
            document.getElementById("detalleDescripcion").textContent = producto.descripcion;
            document.getElementById("detalleTallas").textContent = producto.tallas;
            document.getElementById("detallePrecio").textContent = formatearPrecio(producto.precio);

            var estado = document.getElementById("detalleEstado");
            estado.textContent = producto.estado;
            estado.className = "badge " + claseEstado(producto.estado);

            var btnComprar = document.getElementById("btnComprar");
            if (producto.estado === "Agotado") {
                btnComprar.style.display = "none";
            } else {
                btnComprar.style.display = "inline-block";
                btnComprar.href = "compra.html?id=" + encodeURIComponent(producto.id);
            }

            modalDetalle.show();
        }

        //  TARJETAS DEL CATÁLOGO 
        var contenedor = document.getElementById("listaProductos");

        function crearTarjeta(producto) {
            var columna = document.createElement("div");
            columna.className = "col-12 col-md-4";

            var caja = document.createElement("div");
            caja.className = "caja-producto text-center p-3";

            var foto = document.createElement("img");
            foto.src = producto.imagen;
            foto.alt = producto.nombre;
            foto.className = "foto-zapato mb-3";
            foto.onerror = function () { foto.src = "img/logo.png"; };

            var titulo = document.createElement("h3");
            titulo.textContent = producto.nombre;

            var descripcion = document.createElement("p");
            descripcion.textContent = producto.descripcion;

            var precio = document.createElement("p");
            precio.className = "precio";
            precio.textContent = formatearPrecio(producto.precio);

            var estado = document.createElement("span");
            estado.className = "badge mb-2 " + claseEstado(producto.estado);
            estado.textContent = producto.estado;

            var boton = document.createElement("button");
            boton.className = "btn-comprar d-block mx-auto mt-2";
            boton.textContent = "Ver detalle";
            boton.addEventListener("click", function () {
                abrirDetalle(producto);
            });

            caja.appendChild(foto);
            caja.appendChild(titulo);
            caja.appendChild(descripcion);
            caja.appendChild(precio);
            caja.appendChild(estado);
            caja.appendChild(boton);
            columna.appendChild(caja);
            contenedor.appendChild(columna);
        }

        //  INICIO 
        var productos = cargarProductos();

        if (productos.length === 0) {
            contenedor.innerHTML = '<p class="titulo-seccion">No hay productos en el catálogo.</p>';
        }

        for (var i = 0; i < productos.length; i++) {
            crearTarjeta(productos[i]);
        }
    </script>

</body>
</html>
